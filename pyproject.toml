[project]
name = "genx-vision-school-system"
version = "1.0.0"
description = "Gen'X Vision School System — Integrated Management System"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "django>=5.0,<5.1",
    "psycopg[binary]>=3.1,<4",
    "celery>=5.3.6",
    "redis>=5.0.3",
    "argon2-cffi>=23.1.0",
    "django-environ>=0.11.2",
    "weasyprint>=61.2",
    "openpyxl>=3.1.2",
    "requests>=2.31.0",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.3.4",
    "pytest>=8.1.1",
    "pytest-django>=4.8.0",
    "pytest-cov>=4.1.0",
    "factory-boy>=3.3.0",
    "locust>=2.24.1",
]

[tool.pytest.ini_options]
minversion = "8.0"
DJANGO_SETTINGS_MODULE = "config.settings.testing"
python_files = ["tests.py", "test_*.py", "*_tests.py"]
addopts = "--strict-markers --no-migrations"
testpaths = ["tests", "apps"]

[tool.coverage.run]
source = ["apps"]
omit = [
    "*/migrations/*",
    "*/tests/*",
    "*/wsgi.py",
    "*/asgi.py",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
]
