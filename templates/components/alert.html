<!--
    Gen'X Vision School System — Reusable Alert/Message Component
    ==============================================================
    Sprint:       SPRINT-01
    Task:         Sprint-01 Task 5 — Base Template Foundation / Components
    Traceability: NFR-006 (Usability), NFR-007 (Mobile Responsiveness)

    Usage:
        {% include "components/alert.html" with message="..." level="success" %}

    Levels: success, danger, warning, info (maps to Bootstrap alert classes)
-->
{% if message %}
<div class="alert alert-{{ level|default:'info' }} alert-dismissible fade show" role="alert">
    {{ message }}
    <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
</div>
{% endif %}
